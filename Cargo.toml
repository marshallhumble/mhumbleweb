[package]
name = "mhumbleweb"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"]}
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
tera = "2.0.0"
serde_json = "1.0.150"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true