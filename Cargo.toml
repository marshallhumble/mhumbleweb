[package]
name = "mhumbleweb"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"]}
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tera = { version = "2.4.0", features = ["glob_fs"] }
serde_json = "1.0.150"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true